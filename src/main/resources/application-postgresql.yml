# PostgreSQL 연결 프로파일.
#
# 실행 예:
#   java -jar target/weboffice.jar --spring.profiles.active=postgresql
#
# 접속 정보는 환경 변수로 넣는다. 설정 파일에 적으면 저장소에 올라간다.
#   WO_DB_HOST  WO_DB_PORT  WO_DB_NAME  WO_DB_USER  WO_DB_PASSWORD
#
# docker compose 로 띄우면 compose.yaml 이 이 값을 채운다.
spring:
  datasource:
    # quoteReturningIdentifiers=false 가 반드시 있어야 한다.
    #
    # 매퍼가 useGeneratedKeys 와 함께 keyColumn="WORKBOOK_SEQ" 처럼 대문자를 쓴다.
    # PgJDBC 는 기본값에서 그것을 RETURNING "WORKBOOK_SEQ" 로 인용하는데, 미인용
    # DDL 로 만든 컬럼은 소문자로 폴딩돼 있어 "칼럼이 없다" 로 실패한다.
    # 대문자 keyColumn 을 소문자로 바꾸는 쪽이 더 자연스럽겠지만, 돌아가는 것을
    # 이유 없이 건드리지 않는다(2026-08-04 기록, 2026-08-05 실증).
    # reWriteBatchedInserts: 드라이버가 여러 줄 INSERT 로 묶어 보낸다. 큰 파일을
    # 올릴 때 셀 넣기가 눈에 띄게 빨라진다(2026-08-18 실측).
    url: jdbc:postgresql://${WO_DB_HOST:localhost}:${WO_DB_PORT:5432}/${WO_DB_NAME:weboffice}?quoteReturningIdentifiers=false&reWriteBatchedInserts=true
    username: ${WO_DB_USER:weboffice}
    password: ${WO_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: datapool-primary
      minimum-idle: 5
      maximum-pool-size: 10
      connection-test-query: SELECT 1
